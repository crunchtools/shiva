# Shiva configuration. Copy to ~/.config/shiva/shiva.conf,
# /usr/local/etc/shiva.conf or /etc/shiva.conf, or pass with -c.
# KEY=VALUE, one per line. Configs written for shiva 0.x still load.

# Directory of group files: one file per group, one host per line.
group_files="/usr/local/etc/shiva"

# Hosts worked on at once (-j).
max_slots=10

# Seconds to wait for each ssh connection.
ssh_timeout=10

# Seconds a command may run before the host is marked failed (-t). 0 = no limit.
command_timeout=0

# Accept host keys not seen before (-A). Changed keys are always refused.
autoaddkeys_support="false"

# Mail the summary through the local MTA after every run. Empty = off.
email_address=""
