name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI trusts only this environment, and the environment admits only
    # v*.*.* tags, so no other ref can mint a publishing token.
    environment:
      name: pypi
      url: https://pypi.org/p/shiva-crunchtools
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
