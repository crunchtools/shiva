name: Container
on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions: {}
jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.40.0
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/shiva
      default-branch: master
      # CLI image: the entrypoint must load, and ssh (the runtime dependency
      # installed by dnf) must be present.
      boot: command
      boot-command: |
        podman run --rm "$IMAGE" --version
        podman run --rm --entrypoint ssh "$IMAGE" -V
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
